name: Ratchet — portable JS checks
# Portable test gate for the Ratchet development branch.
on:
  push:
    branches:
      - codex/ratchet-oneclick-diagnostics
    paths:
      - "products/ratchet/app/**"
      - ".github/workflows/ratchet-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: products/ratchet/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check server.cjs
          node --check updater.cjs
          node --check ui/panel.js
          node --check ui/browser-bridge.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs
