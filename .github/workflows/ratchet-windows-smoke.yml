name: Ratchet — Windows startup smoke
# Windows-runner provisioning is currently failing before step execution.
# Keep native tests as mandatory release gate, but avoid failing every source commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
        working-directory: products/ratchet/app
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript tests
        run: |
          node --check server.cjs
          node --test tests/*.test.cjs
      - name: Parse PowerShell scripts
        run: |
          $files = @('Ratchet-Backend.ps1','Ratchet-Kuleczka.ps1','Uruchom-Ratchet-Bez-Electron.ps1','Apply-Ratchet-Update.ps1','Diagnostyka-Ratchet.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { throw "Parser error $f : $($errors | Out-String)" }
            Write-Host "PARSE_OK: $f"
          }
      - name: One-click diagnostics run when backend is offline
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Diagnostyka-Ratchet.ps1 -Quiet | Out-Null
          $reports = Join-Path $env:LOCALAPPDATA 'Ratchet\diagnostics'
          $newest = Get-ChildItem -LiteralPath $reports -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $newest) { throw 'No diagnostics folder' }
          $json = Get-Content -LiteralPath (Join-Path $newest.FullName 'report.json') -Raw | ConvertFrom-Json
          if ($json.sharing -ne 'LOCAL_ONLY_NOT_SENT') { throw 'Report must remain local' }
          if (-not $json.reportId -or -not $json.backend.status -or -not $json.files) { throw 'Incomplete report' }
          if (-not (Test-Path (Join-Path $newest.FullName 'summary.txt'))) { throw 'Missing summary' }
          Write-Host "DIAGNOSTICS_OK: $($json.reportId) / backend $($json.backend.status)"
      - name: Start backend via PowerShell and verify health
        run: |
          $ErrorActionPreference = 'Stop'
          . .\Ratchet-Backend.ps1
          try {
            $h = Start-RatchetBackend
            if (-not $h) { throw "Start-RatchetBackend returned null" }
            if (-not $h.ok -or $h.version -ne '0.2.7') { throw "Wrong health response: $($h|ConvertTo-Json -Compress)" }
            Write-Host "BACKEND_OK: $($h|ConvertTo-Json -Compress)"
          } finally {
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:47823/api/action' -Method Post -ContentType 'application/json' -Headers @{'X-Ratchet-Local'='1'} -Body '{"action":"quit","data":{}}' -TimeoutSec 3 | Out-Null
            } catch { Write-Host "Stop error: $($_.Exception.Message)" }
          }
      - name: Diagnostics on failure
        if: failure()
        run: |
          $root=Join-Path $env:LOCALAPPDATA 'Ratchet'
          Write-Host "APP_DATA: $root"
          Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
          Get-ChildItem -LiteralPath (Join-Path $root 'logs') -Filter '*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "\nLOG: $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 70 -ErrorAction SilentlyContinue }
